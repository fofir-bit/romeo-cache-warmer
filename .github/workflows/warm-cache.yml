name: Warm cache

on:
  schedule:
    # Two attempts per night at odd minutes (Israel night). If one hits a GitHub
    # infrastructure hiccup, the other covers it. Odd minutes avoid the top-of-hour rush.
    - cron: '17 0 * * *'   # 03:17 Israel (summer) / 02:17 (winter)
    - cron: '7 1 * * *'   # 04:07 Israel (summer) / 03:07 (winter) - backup attempt
  workflow_dispatch: {} # lets you run it manually from the Actions tab

# Prevent two runs overlapping if one is still going
concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Warm the cache (with in-run retries)
        env:
          SITE_URL: https://romeo-gifts.co.il
          CONCURRENCY: '2'      # at most 2 pages at a time — gentle on the origin
          DELAY_MS: '400'       # pause between requests per worker
          REQ_TIMEOUT_MS: '20000'
          VERIFY: 'false'       # single warming pass (faster run)
        run: |
          for attempt in 1 2 3; do
            echo "=== Warm attempt $attempt ==="
            node warm.js && exit 0
            echo "Attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "All 3 attempts failed."
          exit 1
