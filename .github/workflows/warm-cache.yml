name: Warm cache

on:
  schedule:
    # Every 3 hours at an odd minute (UTC). GitHub starts scheduled runs late
    # (measured Nov 2026: a 02:17 run actually started 09:00-11:00 Israel), and every
    # content edit on the site purges the whole cache, so one nightly run is not enough.
    - cron: '17 */3 * * *'
  workflow_dispatch: {} # lets you run it manually from the Actions tab

# Prevent two runs overlapping if one is still going
concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    # v3 warms ~300 sitemap + ~390 variation URLs twice (desktop + mobile User-Agent),
    # so a fully cold run can take ~50 min.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Warm the cache (with in-run retries)
        env:
          SITE_URL: https://romeo-gifts.co.il
          CONCURRENCY: '2' # at most 2 pages at a time — gentle on the origin
          DELAY_MS: '400' # pause between requests per worker
          REQ_TIMEOUT_MS: '20000'
          VERIFY: 'false' # single warming pass (faster run)
          WARM_VARIATIONS: 'true' # v2: also warm ?attribute_pa_... variation URLs
          WARM_MOBILE: 'true' # v3: second pass with a mobile User-Agent (WP Rocket mobile cache)
        run: |
          for attempt in 1 2 3; do
            echo "=== Warm attempt $attempt ==="
            node warm.js && exit 0
            echo "Attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "All 3 attempts failed."
          exit 1
