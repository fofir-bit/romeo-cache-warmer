name: Warm cache

on:
  schedule:
    # 01:43 UTC daily = 04:43 (summer) / 03:43 (winter) Israel time — night.
    # Odd minute (:43) avoids the top-of-hour runner rush that can queue/drop jobs.
    - cron: '43 1 * * *'
  workflow_dispatch: {} # lets you run it manually from the Actions tab

# Prevent two runs overlapping if one is still going
concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Warm the cache (gentle, throttled)
        env:
          SITE_URL: https://romeo-gifts.co.il
          CONCURRENCY: '2'      # at most 2 pages at a time — gentle on the origin
          DELAY_MS: '400'       # pause between requests per worker
          REQ_TIMEOUT_MS: '20000'
          VERIFY: 'false'       # single warming pass (faster run, less exposure to CI flakiness)
        run: node warm.js
